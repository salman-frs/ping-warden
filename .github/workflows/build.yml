name: Build Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.scope.outputs.native }}
      shell: ${{ steps.scope.outputs.shell }}
    steps:
      - name: Checkout change history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Identify changed source surfaces
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 .github/scripts/ci-scope.py

  build:
    needs: scope
    if: needs.scope.outputs.native == 'true'
    runs-on: macos-26

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Show Xcode version
      run: xcodebuild -version

    - name: Validate version consistency
      if: needs.scope.outputs.native == 'true'
      run: |
        APP_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" PingWarden/PingWarden/Info.plist)
        HELPER_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" PingWarden/PingWardenHelper/Info.plist)
        WIDGET_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" PingWarden/PingWardenWidget/Info.plist)
        APP_BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" PingWarden/PingWarden/Info.plist)
        HELPER_BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" PingWarden/PingWardenHelper/Info.plist)
        WIDGET_BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" PingWarden/PingWardenWidget/Info.plist)

        if [ "$APP_VERSION" != "$HELPER_VERSION" ] || [ "$APP_VERSION" != "$WIDGET_VERSION" ]; then
          echo "ERROR: Version mismatch across targets"
          echo "app=$APP_VERSION helper=$HELPER_VERSION widget=$WIDGET_VERSION"
          exit 1
        fi
        if [ "$APP_BUILD" != "$HELPER_BUILD" ] || [ "$APP_BUILD" != "$WIDGET_BUILD" ]; then
          echo "ERROR: Build-version mismatch across targets"
          echo "app=$APP_BUILD helper=$HELPER_BUILD widget=$WIDGET_BUILD"
          exit 1
        fi
        if [[ ! "$APP_BUILD" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
          echo "ERROR: CFBundleVersion must contain one to three dot-separated integers: $APP_BUILD"
          exit 1
        fi
        echo "✓ Target versions are consistent ($APP_VERSION, build $APP_BUILD)"

    - name: Run core logic tests
      if: needs.scope.outputs.native == 'true'
      run: swift test

    - name: Test helper interface failures and recovery
      if: needs.scope.outputs.native == 'true'
      run: bash scripts/test_helper.sh

    - name: Test helper connection recovery and callback ordering
      if: needs.scope.outputs.native == 'true'
      run: python3 scripts/test_monitor.py

    - name: Test protection coordinator transitions and recovery
      if: needs.scope.outputs.native == 'true'
      run: python3 scripts/test_coordinator.py

    - name: Build complete app
      if: needs.scope.outputs.native == 'true'
      run: |
        xcodebuild build \
          -project PingWarden/PingWarden.xcodeproj \
          -scheme PingWarden \
          -configuration Release \
          -destination 'generic/platform=macOS' \
          -derivedDataPath "$RUNNER_TEMP/PingWardenDerivedData" \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          ONLY_ACTIVE_ARCH=NO

    - name: Verify Build Artifacts
      if: needs.scope.outputs.native == 'true'
      run: |
        echo "=== Build Verification Results ==="
        echo ""
        APP="$RUNNER_TEMP/PingWardenDerivedData/Build/Products/Release/Ping Warden.app"
        echo "Application bundle:"
        ls -ld "$APP"
        file "$APP/Contents/MacOS/Ping Warden"
        echo ""
        echo "Embedded privileged helper:"
        file "$APP/Contents/MacOS/PingWardenHelper"
        echo ""
        echo "Embedded widget:"
        ls -ld "$APP/Contents/PlugIns/PingWardenWidget.appex"
        echo ""
        echo "Helper launch daemon:"
        ls -l "$APP/Contents/Library/LaunchDaemons/com.salmanfrs.pingwarden.helper.plist"
        echo ""
        echo "=== Build verification passed ==="

  # The core package (PingWarden/PingWarden/Core) is pure Foundation/POSIX
  # and compiles on Linux; running the suite here catches portability
  # regressions that the macOS job can't see, and gives much faster feedback.
  linux-core-tests:
    needs: scope
    if: needs.scope.outputs.native == 'true'
    runs-on: ubuntu-latest
    container: swift:5.10
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Run core logic tests
      run: swift test

  shell-lint:
    needs: scope
    if: needs.scope.outputs.shell == 'true'
    runs-on: macos-26
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install shellcheck
      run: brew install shellcheck

    - name: Lint shell scripts
      run: |
        set -e
        scripts=(
          script/build_and_run.sh
          scripts/run-smoke-tests.sh
          scripts/test_helper.sh
        )
        for f in "${scripts[@]}"; do
          echo "=== bash -n $f ==="
          bash -n "$f"
          echo "=== shellcheck $f ==="
          # error severity only: catches genuine bugs (unquoted-but-globbed vars,
          # undefined references, command-substitution mistakes) without flagging
          # intentionally-kept documentation variables.
          shellcheck --severity=error "$f"
        done
